{% extends "base.html" %}
{% block title %}Edit {{ service.name }} | Admin{% endblock %}
{% block content %}<section class="py-5 settings-bg"><div class="container">{% include "_admin_nav.html" %}<div class="settings-card"><div class="d-flex justify-content-between mb-4"><div><p class="section-kicker">Service settings</p><h1 class="h2">Edit {{ service.name }}</h1></div><a class="btn btn-outline-secondary align-self-start" href="{{ url_for('main.admin_settings') }}">Back</a></div><form method="post" enctype="multipart/form-data"><div class="row g-4"><div class="col-12"><label class="form-label">Service title</label><input class="form-control" name="title" value="{{ service.title }}" required></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="short_desc" rows="4" required>{{ service.short_desc }}</textarea></div><div class="col-12"><label class="form-label">Documents required (comma-separated)</label><textarea class="form-control" name="documents" rows="4">{{ service.documents or '' }}</textarea></div><div class="col-md-8"><label class="form-label">Replace image</label><input type="file" class="form-control" name="image" accept=".png,.jpg,.jpeg,.webp"><div class="form-text">Current: {{ service.image_filename or 'No image' }}</div></div><div class="col-md-4 d-flex align-items-end"><div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" name="is_active" id="isActive" {{ 'checked' if service.is_active is not false }}><label class="form-check-label" for="isActive">Active service</label></div></div><div class="col-12"><button class="btn btn-success btn-lg" type="submit">Save Service</button></div></div></form></div></div></section>{% endblock %}
