<div class="col-md-6 col-lg-4">
    <article class="card service-card h-100 border-0 shadow-sm">
        <div class="card-body d-flex flex-column p-4">
            <div class="service-card-icon icon-theme-{{ service.icon_theme }} mb-3" aria-hidden="true"><i class="bi {{ service.service_icon }}"></i></div>
            <h3 class="h5 card-title">{{ service.name }}</h3>
            <p class="card-text text-secondary">{{ service.description }}</p>
            {% set availability_class, availability_label = service.availability %}
            <span class="availability-badge availability-{{ availability_class }} mt-auto align-self-start"><i class="bi bi-check-circle me-1"></i>{{ availability_label }}</span>
        </div>
        <div class="card-footer bg-transparent border-0 px-4 pb-4">
            <a class="service-click-btn" href="{{ url_for('main.service_detail', service_id=service.id) }}">Click Here <i class="bi bi-arrow-right"></i></a>
        </div>
    </article>
</div>
